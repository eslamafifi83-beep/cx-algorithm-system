<style>
  :root {
    --midnight: #0C1128;
    --midnight-deep: #090D20;
    --panel: #121938;
    --card: #151D42;
    --gold: #E9A33D;
    --gold-light: #F4C069;
    --gold-deep: #C9862A;
    --blue: #6FA8DC;
    --blue-light: #9CC4E8;
    --li-blue: #2F6FB0;
    --text: #F2F1EC;
    --muted: #A7ADC9;
    --hairline: rgba(242, 241, 236, 0.10);
    --hairline-gold: rgba(233, 163, 61, 0.35);
    --display: "Poppins", "Poppins Fallback", system-ui, sans-serif;
    --body: "Poppins", "Poppins Fallback", system-ui, sans-serif;
    --mono: "Poppins", "Poppins Fallback", system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --gutter: clamp(1.25rem, 5vw, 4.5rem);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--body);
    background:
      radial-gradient(120% 55% at 80% 0%, rgba(59, 78, 158, 0.30), transparent 65%),
      var(--midnight);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .container { max-width: 1360px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
  ::selection { background: var(--gold); color: var(--midnight); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .site-header {
    position: sticky; top: 0; z-index: 90;
    background: rgba(12, 17, 40, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; height: 5.25rem; }
  .brand { display: flex; align-items: center; gap: 0.875rem; text-decoration: none; color: var(--text); flex: none; }
  .brand-mark { width: 46px; height: 46px; border-radius: 12px; display: block; }
  .brand-name { font-family: var(--display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; line-height: 1.45; text-transform: uppercase; }
  .brand-name span { color: var(--gold); }
  .site-nav { display: flex; align-items: center; gap: clamp(1rem, 2.5vw, 2.25rem); }
  .site-nav a {
    font-family: var(--display); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text); text-decoration: none; padding: 0.375rem 0; position: relative; opacity: 0.85;
    transition: opacity 0.25s var(--ease), color 0.25s var(--ease);
  }
  .site-nav a::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 100%; height: 2px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform 0.3s var(--ease); }
  .site-nav a:hover { opacity: 1; color: var(--gold-light); }
  .site-nav a:hover::after, .site-nav a[aria-current="page"]::after { transform: scaleX(1); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.625rem;
    font-family: var(--display); font-weight: 700; font-size: 0.8125rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.875rem 1.75rem; border-radius: 999px; text-decoration: none; cursor: pointer; border: none; min-height: 44px;
    transition: transform 0.2s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease);
  }
  .btn-gold { background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: #2A1D05; box-shadow: 0 6px 24px rgba(233, 163, 61, 0.28); }
  .btn-gold:hover { box-shadow: 0 10px 32px rgba(233, 163, 61, 0.42); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--text); border: 1.5px solid rgba(255, 255, 255, 0.16); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold-light); }

  main { padding: clamp(2.5rem, 5.5vw, 3.875rem) 0 clamp(3.25rem, 6vw, 5.25rem); }

  /* Header */
  .blog-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem; margin-bottom: clamp(2rem, 4.5vw, 3.25rem); }
  .kicker { font-family: var(--mono); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.28em; color: var(--gold); text-transform: uppercase; }
  .blog-head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 4.4vw, 3.375rem); line-height: 1.08; letter-spacing: -0.02em; margin-top: 0.625rem; max-width: 17ch; }
  .blog-head .sub { color: var(--muted); font-size: 1.0625rem; max-width: 56ch; margin-top: 0.875rem; }
  .nl-btn {
    display: inline-flex; align-items: center; gap: 0.75rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    padding: 0.7rem 1.25rem;
    text-decoration: none;
    color: #DFE7F3;
    font-family: var(--display); font-size: 0.875rem; font-weight: 600;
    transition: border-color 0.25s var(--ease), transform 0.2s var(--ease);
    white-space: nowrap;
  }
  .nl-btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .nl-btn[hidden] { display: none; }
  .in-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: var(--li-blue);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 0.8rem; color: #fff;
  }
  .nl-btn .arrow { color: var(--gold); flex: none; }

  /* Featured */
  .featured {
    display: grid;
    grid-template-columns: minmax(0, 520px) 1fr;
    gap: clamp(1.5rem, 3vw, 2.25rem);
    background: linear-gradient(135deg, rgba(233, 163, 61, 0.09), rgba(74, 110, 180, 0.05));
    border: 1px solid rgba(233, 163, 61, 0.2);
    border-radius: 22px;
    padding: clamp(1.25rem, 2.5vw, 1.625rem);
    margin-bottom: clamp(2.5rem, 5vw, 3.75rem);
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.3s var(--ease);
  }
  .featured:hover { border-color: var(--hairline-gold); }
  .featured-thumb {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    min-height: 260px;
    max-height: 320px;
    background: radial-gradient(120% 120% at 40% 30%, #1C2F57, #0E1C3B);
  }
  .featured-thumb img, .featured-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .featured-thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .feat-chip {
    position: absolute; top: 0.875rem; left: 0.875rem;
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(12, 24, 48, 0.82);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 0.35rem 0.7rem;
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.18em; color: var(--gold-light);
    pointer-events: none;
  }
  .feat-chip .in-mark { width: 18px; height: 18px; border-radius: 5px; font-size: 0.58rem; }
  .featured-body { display: flex; flex-direction: column; justify-content: center; gap: 0.875rem; min-width: 0; }
  .meta-line { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .tag-pill {
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
    background: rgba(233, 163, 61, 0.14); color: var(--gold-light);
    border-radius: 999px; padding: 0.25rem 0.75rem;
  }
  .meta-dim { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .featured-body h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 2.6vw, 2.125rem); line-height: 1.2; letter-spacing: -0.01em; }
  .featured-body .excerpt { color: var(--muted); max-width: 58ch; }
  .featured-body .cta { margin-top: 0.625rem; }

  /* Grid + filters */
  .grid-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .grid-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.375rem; }
  .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    font-family: var(--display); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
    background: rgba(255, 255, 255, 0.05); color: #C7D3E8;
    border: none; border-radius: 999px; padding: 0.5rem 1.1rem; cursor: pointer;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .chip.active { background: var(--gold); color: #12203C; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .post {
    display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease);
  }
  .post:hover { transform: translateY(-4px); border-color: var(--hairline-gold); }
  .post-thumb { position: relative; height: 210px; background: radial-gradient(120% 120% at 40% 30%, #1C2F57, #0E1C3B); }
  .post-thumb img, .post-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-thumb .in-badge {
    position: absolute; top: 0.75rem; left: 0.75rem;
    width: 26px; height: 26px; border-radius: 7px;
    background: rgba(47, 111, 176, 0.95);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 0.72rem; color: #fff;
    pointer-events: none;
  }
  .post-thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .post-body { display: flex; flex-direction: column; flex: 1; padding: 1.375rem; gap: 0.625rem; }
  .post-body .tag-pill { background: rgba(111, 168, 220, 0.14); color: #9CC2E8; }
  .post-body h3 { font-family: var(--display); font-weight: 700; font-size: 1.1rem; line-height: 1.35; }
  .post-body .excerpt { color: var(--muted); font-size: 0.9rem; flex: 1; }
  .post-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    border-top: 1px solid var(--hairline);
    padding-top: 0.875rem; margin-top: 0.375rem;
  }
  .post-foot .date { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .read-link { font-family: var(--display); font-size: 0.8rem; font-weight: 600; color: var(--gold); white-space: nowrap; }
  .load-wrap { display: flex; justify-content: center; padding-top: 2.25rem; }
  .load-wrap[hidden] { display: none; }
  .empty-note {
    border: 1px dashed var(--hairline-gold);
    border-radius: 18px;
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--muted);
  }

  .footer { background: var(--midnight-deep); border-top: 1px solid var(--hairline); padding: 2rem 0; }
  .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
  .footer a { color: var(--muted); text-decoration: none; font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .footer a:hover { color: var(--gold-light); }
  .footer .copy { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--muted); }

  /* Hold space for content that arrives after the page loads, so nothing jumps (layout shift) */
  main { min-height: 100vh; }
  /* Article page (/blog/<address>): the blog's colours and type, set for long reading */
  .art { max-width: 760px; margin: 0 auto; }
  .art-back { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted); text-decoration: none; font-family: var(--display); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.25s var(--ease); }
  .art-back:hover { color: var(--gold-light); }
  .art-head { margin-top: 1.75rem; display: flex; flex-direction: column; gap: 1rem; }
  .art-head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 4.2vw, 3rem); line-height: 1.12; letter-spacing: -0.02em; }
  .art-by { display: flex; align-items: center; flex-wrap: wrap; gap: 0.875rem 1.25rem; margin-top: 0.375rem; }
  .art-by .who { display: flex; align-items: center; gap: 0.75rem; }
  .art-by img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--hairline-gold); }
  .art-by .n { font-family: var(--display); font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
  .art-by .r { color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
  .art-li { display: inline-flex; align-items: center; gap: 0.5rem; color: #DFE7F3; text-decoration: none; font-family: var(--display); font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.09); background: rgba(255, 255, 255, 0.05); border-radius: 999px; padding: 0.4rem 0.9rem 0.4rem 0.45rem; transition: border-color 0.25s var(--ease); }
  .art-li:hover { border-color: var(--gold); }

<script src="/assets/loader.js"></script>

<header class="site-header">

      <a href="/">Home</a>
      <a href="/guests">Guests</a>

      <a href="/episodes">Episodes</a>

      <a class="btn btn-gold header-subscribe" href="/contact">Contact us</a>

        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="17" y2="14"/></svg>

</header>

  </div>
</footer>

<script>
  // The cover video (13–19 MB) starts only once the page has loaded; with reduced motion it stays still
  window.addEventListener('load', () => {
    const v = document.querySelector('.art-hero video[data-src]');
    if (!v) return;
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    v.preload = still ? 'metadata' : 'auto';
    v.src = v.dataset.src;
    if (!still) v.play().catch(() => {});
  });
  const navToggle = document.getElementById('navToggle');
  if (navToggle) {
    const siteNav = document.getElementById('siteNav');
    navToggle.addEventListener('click', () => {
      const open = siteNav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(open));
    });
    siteNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      siteNav.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    }));
  }
</script>

<script src="/assets/nav.js"></script>
